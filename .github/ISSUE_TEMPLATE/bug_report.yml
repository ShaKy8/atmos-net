name: Bug report
description: Something looks wrong or stopped working
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you saw, and what you expected instead. Screenshots help.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: A view, a deep link such as `#radar`, or the request that misbehaves.
  - type: input
    id: version
    attributes:
      label: Version
      description: Commit hash or release (`git rev-parse --short HEAD`).
  - type: input
    id: env
    attributes:
      label: Environment
      description: Node version, OS, and browser if it is a page problem.
  - type: textarea
    id: logs
    attributes:
      label: Logs or console output
      render: text
  - type: markdown
    attributes:
      value: Please leave out your home coordinates and any other personal details.
