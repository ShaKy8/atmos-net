<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="dark">
<title>ATMOS//NET wallpaper</title>
<link rel="stylesheet" href="/css/fonts.css">
<style>
  /*
   * LAYOUT CONTRACT with the optional desktop HUD.
   *
   * A companion HUD can be painted over this wallpaper and mirror this block
   * row for row, using numbers copied from here, so they are fixed points,
   * not taste:
   *
   *   x      text starts at 5.5vw; this block must end before 41vw, where the
   *          HUD's first divider is
   *   rows   caption / 8.5vw hero / condition / meta, stacked up from 7vh,
   *          so the block spans ~74vh to 93vh
   *   note   the HUD draws a one-line rain / AQI note at 69.5-72.5vh, x 5.5vw,
   *          just above the caption row, so nothing here may rise above it
   *
   * Everything that sets a row is therefore in vw/vh, like the HUD, never in a
   * unit that depends on the aspect ratio.
   */
  /* Declared dark so Chromium's auto-dark never repaints the white marker as #121212. */
  :root {
    color-scheme: dark; --cyan: #00eaff; --ink: #d6ecfa; --dim: rgba(214,236,250,.46);
    --zone: 35.4vw;           /* 5.5vw + 35.4vw = 40.9vw, clear of the 41.8vw divider */
    --hero: 8.5vw;            /* #temp font size; its line box is .84 of this */
    /* Height of the old condition row + meta row + the margins between them:
       measured 1.95vw + 1.108vw, plus .7vh + 1.4vh. The cells fill exactly that. */
    --lower: calc(3.058vw + 2.1vh);
  }
  html, body { margin: 0; height: 100%; background: #03050b; overflow: hidden; }
  #sky { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }

  /* Above the scanlines so the small type stays crisp; the scrim keeps the
     neon grid from cutting through it. */
  #hud {
    position: fixed; left: 5.5vw; bottom: 7vh; width: var(--zone); z-index: 4;
    font-family: 'Chakra Petch', system-ui, sans-serif; color: var(--ink);
  }
  #hud::after {
    content: ''; position: absolute; z-index: -1; pointer-events: none;
    inset: -2.2vh -1vw -2.4vh -2vw;
    background: rgba(3,5,11,.78);
    -webkit-mask-image: linear-gradient(90deg, #000 72%, transparent), linear-gradient(to bottom, transparent, #000 10%, #000 86%, transparent);
    -webkit-mask-composite: source-in; mask-composite: intersect;
  }
  #hud::before {
    content: ''; position: absolute; left: -1.4vw; top: -.4vh; bottom: -.6vh; width: 2px;
    background: linear-gradient(to bottom, var(--cyan), rgba(0,234,255,.12));
    box-shadow: 0 0 .9vw rgba(0,234,255,.55);
  }
  .k {
    font: 500 .72vw/1.2 'JetBrains Mono', monospace;
    letter-spacing: .2em; text-transform: uppercase; color: var(--dim);
  }

  /* Caption row: where, and how old this still is. */
  #cap { display: flex; align-items: center; margin-bottom: .9vh; }
  #place {
    flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    font-size: .78vw; letter-spacing: .34em; text-transform: uppercase; color: rgba(214,236,250,.58);
  }
  #sync { flex: none; margin-left: 2vw; font: 500 .72vw/1 'JetBrains Mono', monospace; letter-spacing: .2em; color: rgba(0,234,255,.72); }

  /* Hero row: the number, with the condition and the day's range beside it. */
  #hero { display: flex; gap: 1.8vw; height: calc(var(--hero) * .84); }
  #temp {
    position: relative; flex: none; font-size: var(--hero); font-weight: 700; line-height: .84; letter-spacing: -.035em;
    text-shadow: -2px 0 0 rgba(255,45,143,.42), 2px 0 0 rgba(0,234,255,.42), 0 0 70px rgba(0,234,255,.2);
  }
  /* The scanlines stay on the hero, where the texture is the point. */
  #temp::after {
    content: ''; position: absolute; inset: 0; pointer-events: none; opacity: .5;
    background: repeating-linear-gradient(to bottom, rgba(0,0,0,0) 0 2px, rgba(0,18,28,.45) 3px 4px);
  }
  #temp .deg { font-size: .36em; vertical-align: top; position: relative; top: .1em; margin-left: .05em; color: var(--cyan); letter-spacing: 0; }
  #side { flex: 1; min-width: 0; display: flex; flex-direction: column; justify-content: space-between; padding: .5vw 0 .55vw; }
  #cond {
    font-size: 1.5vw; line-height: 1.15; font-weight: 700; letter-spacing: .22em; text-transform: uppercase;
    color: var(--cyan);
  }

  /* Where the day is going: low to high, a dot for now, a tick for the station. */
  #range { display: flex; align-items: center; gap: .7vw; font: 500 .9vw/1 'JetBrains Mono', monospace; }
  #range[hidden] { display: none; }
  #range b { font-weight: 500; color: var(--ink); }
  #track {
    position: relative; flex: 1; min-width: 4vw; height: 3px; border-radius: 2px;
    background: linear-gradient(90deg, rgba(0,234,255,.5), rgba(255,45,143,.75));
  }
  #track i { position: absolute; top: 50%; transform: translate(-50%, -50%); }
  #track .now {
    width: .9vw; height: .9vw; border-radius: 50%; background: #fff;
    outline: 2px solid rgba(3,5,11,.9);
    box-shadow: 0 0 1vw var(--cyan);
  }
  #track .obs { width: 2px; height: 1.3vw; background: var(--cyan); opacity: .85; }

  /* Lower rows: fixed width, space-between, so each column keeps its place
     from render to render however long its text is. */
  #cells { display: flex; justify-content: space-between; align-items: flex-end; height: var(--lower); }
  .cell { flex: none; padding-left: 1.4vw; border-left: 1px solid rgba(214,236,250,.14); white-space: nowrap; }
  .cell:first-child { padding-left: 0; border-left: 0; }
  .cell .v {
    margin-top: .3vw; display: flex; align-items: center; gap: .45vw;
    font: 500 1.3vw/1.15 'JetBrains Mono', monospace; letter-spacing: .02em;
  }
  .cell .v svg { width: 1vw; height: 1vw; color: var(--cyan); flex: none; }
  .cell .s { margin-top: .25vw; min-height: 1.2em; letter-spacing: .14em; }

  #scan {
    position: fixed; inset: 0; z-index: 3; pointer-events: none;
    background: repeating-linear-gradient(to bottom,
      rgba(0,0,0,0) 0 2px, rgba(0,18,28,.30) 3px 4px);
    opacity: .30;
  }
  #vig {
    position: fixed; inset: 0; z-index: 1; pointer-events: none;
    background: radial-gradient(130% 100% at 50% 45%, transparent 45%, rgba(0,0,0,.5) 100%);
  }
  body.bare #hud, body.bare #scan { display: none; }
</style>
</head>
<body>
<canvas id="sky"></canvas>
<div id="vig"></div>
<div id="hud">
  <div id="cap"><span id="place">—</span><span id="sync"></span></div>
  <div id="hero">
    <div id="temp">--<span class="deg">°</span></div>
    <div id="side">
      <div id="cond">—</div>
      <div id="range" hidden></div>
    </div>
  </div>
  <div id="cells"></div>
</div>
<div id="scan"></div>

<script type="module">
/*
 * Renders the console's sky shader at the current conditions and nothing
 * else, sized to the window. `atmos-wallpaper` screenshots this at the
 * monitor's resolution and hands the result to `omarchy theme bg set`, so the
 * desktop background is literally the sky over the house right now.
 *
 * Query parameters:
 *   ?bare        hide the text readout, sky only
 *   ?q=0..3      render quality (default 2)
 *   ?t=<epoch>   render a specific moment instead of now
 *   ?fresh       make the server refetch its live feeds first
 */
import { Sky } from '/js/gl/sky.js';
import { store } from '/js/state.js';
import { api } from '/js/api.js';
import { fmt as F, compass, dur, escapeHtml } from '/js/lib/util.js';

const params = new URLSearchParams(location.search);
if (params.has('bare')) document.body.classList.add('bare');

const sky = new Sky(document.getElementById('sky'));
const ok = sky.init();
if (!ok) document.title = 'ERROR webgl';
sky.setQuality(params.has('q') ? +params.get('q') : 2);

const $ = (id) => document.getElementById(id);

try {
  const cfg = await api.config();
  await store.setLocation(store.loc || cfg.home, { remember: false });

  const when = params.has('t') ? +params.get('t') : Date.now();
  store.setCursor(when, { silent: true });

  const p = store.skyParams(when);
  if (p && ok) sky.snap(p);

  const f = store.frame(when);
  if (f) {
    const tf = store.fmt;
    const ob = store.observed?.station && store.observed.tempF != null ? store.observed : null;

    $('place').textContent = `${store.loc.name} · ${store.loc.admin1 || ''}`.replace(/ · $/, '');
    // The image is a still, so say how old it is.
    $('sync').textContent = `SYNC ${tf.hm(when)}`;
    $('temp').firstChild.nodeValue = f.temp == null ? '--' : Math.round(f.temp);
    $('cond').textContent = f.wx.label;

    // Day range: low, high, a dot for the hero number, a tick for the station.
    const lo = f.day?.tmin, hi = f.day?.tmax;
    if (lo != null && hi != null && hi > lo && f.temp != null) {
      const at = (v) => `${Math.min(100, Math.max(0, ((v - lo) / (hi - lo)) * 100)).toFixed(1)}%`;
      const showObs = ob && Math.abs(ob.tempF - f.temp) >= 1;
      $('range').innerHTML =
        `<span class="k">LO</span><b>${F.temp(lo)}</b>` +
        `<div id="track">${showObs ? `<i class="obs" style="left:${at(ob.tempF)}"></i>` : ''}` +
        `<i class="now" style="left:${at(f.temp)}"></i></div>` +
        `<b>${F.temp(hi)}</b><span class="k">HI</span>`;
      $('range').hidden = false;
    }

    // Sun: whichever of sunrise/sunset is next, counted from the moment shown.
    const t0 = store.sunTimesFor(when);
    let sunK = 'SUNSET', sunAt = t0.sunset;
    if (t0.sunrise && when < +t0.sunrise) { sunK = 'SUNRISE'; sunAt = t0.sunrise; }
    else if (t0.sunset && when >= +t0.sunset) { sunK = 'SUNRISE'; sunAt = store.sunTimesFor(when + 864e5).sunrise; }
    const sunIn = sunAt ? `in ${dur((+sunAt - when) / 1000)}` : '';

    // Wind blows toward windDir + 180; the arrow points the way it is going.
    const arrow = f.wind == null ? '' :
      `<svg viewBox="0 0 24 24" style="transform:rotate(${(f.windDir ?? 0) + 180}deg)"><path d="M12 2l7 19-7-4-7 4z" fill="currentColor"/></svg>`;

    const cells = [
      { k: 'FEELS', v: F.temp(f.feels), s: f.rh != null ? `HUM ${F.pct(f.rh)}` : '' },
      ob && { k: 'STATION', v: F.temp(ob.tempF), s: `${escapeHtml(ob.station)} · ${ob.distanceMi} MI` },
      { k: 'WIND', v: `${arrow}${F.wind(f.wind)} ${compass(f.windDir)}`, s: f.gust != null ? `GUST ${F.wind(f.gust)}` : '' },
      { k: sunK, v: sunAt ? tf.hm(sunAt) : '--', s: sunIn },
    ].filter(Boolean);
    $('cells').innerHTML = cells.map((c) =>
      `<div class="cell"><div class="k">${c.k}</div><div class="v">${c.v}</div><div class="k s">${c.s || ''}</div></div>`).join('');
  }
} catch (e) {
  console.error('[wallpaper]', e);
  document.title = 'ERROR ' + e.message;
}

/*
 * A few frames, not hundreds. sky.snap() sets target AND current params, so
 * nothing is easing and every frame after the first is identical — the old
 * 240-frame loop cost 45-85s of CPU and ~800MB RSS per render for no visual
 * difference whatsoever. These few frames only guarantee fonts have loaded
 * and the canvas has actually painted.
 */
// With only a few frames rendered, "the fonts happened to load in time" is no
// longer a safe assumption -- wait on them explicitly, after the HUD text is
// written so the final glyphs are the ones measured.
try { await document.fonts.ready; } catch { /* not supported; fall back */ }

let n = 0;
requestAnimationFrame(function loop(t) {
  sky.render(t, 0.016);
  if (n++ < 3) requestAnimationFrame(loop);
  else document.title = 'READY';
});
</script>
</body>
</html>
